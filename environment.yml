# MSHI v3 reference environment.
#   conda env create -f environment.yml && conda activate mshi-v3
# or, without conda (what the reference runs used):
#   python3.13 -m venv .venv && .venv/bin/pip install -r requirements-lock.txt
#
# xgboost is pinned to 2.1.4: the original website numbers reproduce exactly only with 2.1.4
# (they shift under 3.x; docs/handoff/prep_log.md section 1). The other pins are the versions the
# v3 reference runs used; requirements-lock.txt has the full transitive lock.
# pygam is NOT included: pygam 0.12.0 requires scipy < 1.17; the Phase-2 GAM uses statsmodels splines.
name: mshi-v3
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
      - numpy==2.5.4
      - pandas==3.1.0
      - scipy==1.18.1
      - scikit-learn==1.9.1
      - statsmodels==0.15.0
      - xgboost==2.1.4
      - pyarrow==26.0.0
      - rasterio==1.5.2
      - geopandas==1.2.0
      - pyproj==3.8.0
      - shapely==2.2.0
      - pyogrio==0.13.0
      - pystac-client==0.9.1
      - requests==2.34.2
      - rdata==1.1.0
      - matplotlib==3.11.2
      - pyyaml==6.0.3
      - pytest==9.2.0
