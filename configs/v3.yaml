  qc_removed_by:
    f_method: {value: 450, rel: 0.02}
    f_quality: {value: 260, rel: 0.02}
    f_coverage: {value: 252, rel: 0.02}
    f_ecosys: {value: 243, rel: 0.02}
    f_dup: {value: 57, rel: 0.02}
  sites_qc_by_continent:
    Asia: {value: 387, rel: 0.02}
    North America: {value: 257, rel: 0.02}
    Europe: {value: 236, rel: 0.02}
    South America: {value: 42, rel: 0.02}
    Africa: {value: 26, rel: 0.02}
