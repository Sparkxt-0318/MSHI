# MSHI v3 pipeline configuration.
# Every source version, path, analysis threshold, reproduction tolerance and seed used by `python -m mshi.run`
# lives here. The code keeps only numerical slack (1e-12 in tolerance comparisons), network retry/timeout
# defaults, and how many examples a result lists. Changing a value here changes results: log every change in
# docs/DECISIONS.md.

version: 3

paths:                       # relative to the repository root
  raw: data/raw              # downloads (gitignored), fetched by the pipeline
  interim: data/interim      # regenerable intermediates (gitignored)
  derived: data/derived      # small derived tables (committed)
  results: results           # JSON results, run log, run times (committed)
  figures: figures           # figures produced by mshi/figures (committed)
  handoff: docs/handoff      # 2026-11-02 handoff bundle (provenance, read-only)

provenance:
  # Path roots whose files are not committed (gitignored, so absent from a fresh clone). A result's recorded
  # output there may be absent without the result being stale; a stage that needs the file refuses to run
  # until it is regenerated (mshi/io.py; docs/DECISIONS.md R-P1-21). tests/test_guards.py checks that these
  # are exactly the gitignored roots.
  local_only_roots: [raw, interim]

# Files under legacy/ are never read, except these (path: pinned SHA-256), used for the NPP reproduction
# check, to add the 889 original sites to the MODIS point set, and (training_features_v2 only) by
# site_diagnostics item 5 (Europe test sites already in the original "Asia" training table).
legacy_allowlist:
  legacy/data/processed/training_features_v2.parquet: 482892dfed5c0897a0743dab72e9c0b563da89f45f6410cdb86b8f080fb5338a
  legacy/data/processed/us_validation_features_v2.parquet: 1fa5d930dc2211cc9e5d19f4047105f6b6fa1f864ac335a3989afb2fec84c058

# Tables the pipeline must refuse to read under any name (SHA-256 of file contents).
forbidden_sha256:
  - 2ffe0fe50df3e5532cef932227a3081ec03e6899c5443fd7c8481c195ac9e016   # 3,000-row synthetic demo table (v1)

sources:
  srdb:
    description: Global Soil Respiration Database v5 (Jian et al. 2021, ESSD 13:255), MIT licence
    repo: bpbond/srdb
    commit: 02163a720bc0b84bd535ad0962c85735816448e8
    file: srdb-data.csv
    url: https://raw.githubusercontent.com/bpbond/srdb/{commit}/{file}
    sha256: c4d7714a0954a0c9b8d4d41ae758defa8c46cb208aa50ef148e762655f892911
    licence_url: https://raw.githubusercontent.com/bpbond/srdb/{commit}/LICENSE
    licence_sha256: 64bd84a5d7afb8f6e9caf1e9c18960e2e8eef1214f1d7a012fc50b8c5456d971
  cosore:
    description: COSORE continuous soil respiration database v0.8.0 (Bond-Lamberty et al. 2020, GCB 26:7268), CC-BY-4.0 (LICENSE at the pinned commit; NOT MIT)
    repo_url: https://github.com/bpbond/cosore
    version: v0.8.0
    commit: 02f32e8e7f9a0f1c26c9dad61c574aef863f1df1
    datasets_dir: inst/extdata/datasets
    licence_file: LICENSE
  naturalearth:
    description: Natural Earth vector v5.1.2 (public domain), GeoJSON from nvkelso/natural-earth-vector
    version: v5.1.2
    commit: f1890d9f152c896d250a77557a5751a93d494776
    url: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/{commit}/geojson/{file}
    files:
      ne_50m_admin_0_countries.geojson: 3e458fc036ad0a66411f2c1e6cac49c5d7bfb81cb1123bc513b22511a2b7fdeb
      ne_110m_land.geojson: 9e0729ee253ca7d7a5c4ae9395fb1902264c5377c52e224d13dd85010e2835d9
      ne_50m_land.geojson: e874b27a51d146452be360cafb3cc50c86001074a67d534113e6534682f9826b
      # map subunits: overseas territories carry the continent where they lie (geographic continent, D-P2-3)
      ne_50m_admin_0_map_subunits.geojson: b1df8433477614c89e6b724990a7ab3733ec647559863321b6255c3fa3fce3ec
  worldclim:
    description: WorldClim 2.1 bioclimatic variables, 1970-2000, 2.5 arc-min (Fick & Hijmans 2017)
    version: "2.1"
    resolution: 2.5m
    url: https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_2.5m_bio.zip
    sha256: null             # WorldClim publishes no checksum; the first download's hash is recorded in results/fetch_worldclim.json
    file_pattern: wc2.1_2.5m_bio_{i}.tif
    nodata_below: -1.0e+30   # values below this are missing
  soilgrids:
    description: SoilGrids 2.0 (Poggio et al. 2021), 5-15 cm mean, resampled by the ISRIC WCS to 0.05 deg, CC-BY-4.0
    version: "2.0"
    wcs_url: https://maps.isric.org/mapserv
    variables: [soc, nitrogen, phh2o, clay, sand, silt, bdod, cec]
    depth: 5-15cm
    statistic: mean
    lon: [-180, 180]
    lat: [-56, 82.7]
    size: [7200, 2774]       # columns, rows (0.05 deg)
    file_pattern: "{var}_{depth}_{statistic}_global_0p05.tif"   # a new depth/statistic gets a new file
    min_valid_bytes: 10000
    # mapped units -> conventional units (as in legacy/src/features.py SOILGRIDS_SCALE)
    scale: {soc: 0.1, nitrogen: 0.01, phh2o: 0.1, clay: 0.1, sand: 0.1, silt: 0.1, bdod: 0.01, cec: 0.1}
    zero_is_missing: true    # handoff features_v3.py: values <= 0 -> NaN
  modis:
    description: MODIS Collection 6.1 MOD17A3HGF NPP and MOD11A2 LST via Microsoft Planetary Computer COGs
    stac_url: https://planetarycomputer.microsoft.com/api/stac/v1
    # SAS token for the STORAGE CONTAINER, not the collection (the collection token returns 403)
    sas_token_url: https://planetarycomputer.microsoft.com/api/sas/v1/token/modiseuwest/modis-061-cogs
    token_refresh_s: 240     # refresh the shared token every 4 minutes; forced refresh on any 403
    threads: 32
    datetime: 2020-01-01/2024-12-31
    max_items_per_tile: 500
    window_deg: 0.05         # mean over valid pixels in a 0.05 x 0.05 deg window centred on the site
    sinusoidal_proj: "+proj=sinu +R=6371007.181 +nadgrids=@null +wktext"
    tile_size_m: 1111950.5197
    x_origin_m: -20015109.354
    y_origin_m: 10007554.677
    retries: 4               # attempts per raster read
    second_pass_threads: 4   # reads still failing are retried once more, with a fresh token; any read still
                             # failing after that fails the stage (no partial means are written or cached)
    # Expected catalog items that are genuinely absent (strings as reported in results/modis_points.json,
    # e.g. "h18v04 npp 2023"). Any other gap fails the stage before a raster is read. Add an entry only
    # after review, and log the decision in docs/DECISIONS.md.
    accepted_catalog_gaps: []
    npp:
      collection: modis-17A3HGF-061
      item_prefix: MOD17A3HGF
      asset: Npp_500m
      valid_range: [0, 32700]
      scale: 0.1             # -> g C m-2 yr-1
      offset: 0.0
    lst:
      collection: modis-11A2-061
      item_prefix: MOD11A2
      assets: {lst_day: LST_Day_1km, lst_night: LST_Night_1km}
      valid_min_exclusive: 0
      scale: 0.02
      offset: -273.15        # -> deg C
      composite: first_of_month   # first 8-day composite of each month (the only rule implemented)
      # MOD11A2 composites start every 8 days (day of year 1, 9, ..., 361), so the first composite of a month
      # starts on day 1-8 of that month; a later first date means the catalog lacks it (a catalog gap)
      composite_days: 8

# COSORE for v3's own analyses (author's decision Q-6, 2026-11-03; DEV-C1-6, D-P2-1). The reproduction keeps
# cosore_annual (the handoff rule).
cosore_analysis:
  msmt_var: Rs               # PORTS.txt CSR_MSMT_VAR: soil respiration only (not Rh, NEE, Reco)
  treatment: "None"          # PORTS.txt CSR_TREATMENT: untreated ports only (port 0 = "all ports" applies otherwise)
  min_obs_days: 150          # as the handoff, per port
  min_span_days: 180         # as the handoff, per port
  # full-year coverage: at least this many observation days in every calendar month (pooled over years);
  # chosen on coverage counts alone (1 day: 42 datasets, 3-5 days: 39, 7: 36, 10: 34), before any Rs value
  min_days_per_month: 5
  flux_clip_umol: [-2.0, 50.0]   # as the handoff
  molar_mass_c: 12.011
  seconds_per_year: 31536000
  rs_range: [50.0, 4500.0]

cosore_annual:
  min_obs_days: 150          # unique observation days per port
  min_span_days: 180         # calendar span per port
  flux_clip_umol: [-2.0, 50.0]
  # umol CO2 m-2 s-1 sustained for a year -> g C m-2 yr-1 = 12.011 * 31,536,000 / 1e6
  molar_mass_c: 12.011
  seconds_per_year: 31536000
  rs_range: [50.0, 4500.0]
  skip_prefix: TEST

site_build:
  rs_range: [50.0, 4500.0]
  manipulation_keep: ["None", "Control", "control"]   # plus missing (NA)
  qc:
    method_regex: "alkali|soda"        # case-insensitive, on Meas_method
    quality_regex: "Q1[0-4]"           # on Quality_flag
    min_annual_coverage: 0.5           # Annual_coverage < 0.5 dropped (missing kept)
    ecosystem_exclude: [Wetland, Urban]
    cosore_ecosystem_exclude_upper: [WET, WETLAND, URB]   # COSORE IGBP codes, upper-cased (as in handoff build_sites_v3.py)
  coord_check:
    max_km: 100.0
    distance_crs: EPSG:3857            # as in the handoff (Web Mercator distances; see DECISIONS.md)
    aliases:
      USA: United States of America
      United States: United States of America
      US: United States of America
      Florida: United States of America
      Alaska: United States of America
      Korea: South Korea
      South Korea: South Korea
      Republic of Korea: South Korea
      UK: United Kingdom
      England: United Kingdom
      Scotland: United Kingdom
      Wales: United Kingdom
      Malyasia: Malaysia
      Isreal: Israel
      Czech Republic: Czechia
      Democratic Republic of Congo: Democratic Republic of the Congo
      Congo: Republic of the Congo
      Tanzania: United Republic of Tanzania
      Serbia: Republic of Serbia
      Taiwan: Taiwan
      Puerto Rico: Puerto Rico
      Hong Kong: Hong Kong S.A.R.
    # (reported country after aliasing, polygon country) pairs that are not coordinate errors
    territory_exceptions:
      - [United States of America, Puerto Rico]
      - [Denmark, Greenland]
      - [France, New Caledonia]
      - [Denmark, Norway]              # Svalbard records reported as Denmark
  continent:
    nearest_max_m: 50000.0             # nearest polygon within 50 km for points off the 1:50m coastline
    nearest_crs: EPSG:3857
    russia_split_lon: 60.0             # Russia west of 60E -> Europe
  merge_radius_km: 5.0                 # records within 5 km merged (connected components)
  earth_radius_km: 6371.0
  variants: [qc, repo]                 # qc = primary; repo = repo filters only (sensitivity)

# The site build for v3's own analyses (author's decisions Q-2, Q-5, Q-6 of 2026-11-03; D-P2-2, D-P2-3).
# Every filter and threshold of site_build applies, except: distances (coordinate check, off-coast fallback)
# are geodesic instead of Web Mercator; COSORE comes from cosore_analysis; each record and site also gets a
# geographic continent (continent_geo), which all new work uses. The locked tables are not changed.
site_build_analysis:
  geo_continent:
    subunits_file: ne_50m_admin_0_map_subunits.geojson
  max_far_km: 2000.0                   # geodesic distances beyond this are reported as "far" (inf)

site_diagnostics:                      # exploratory checks only; no table is changed
  # broad geographic boxes [lon0, lon1, lat0, lat1]; sites whose continent label falls outside are listed
  continent_boxes:
    Europe: [-32.0, 70.0, 34.0, 82.0]
  # the original (v1/v2) "Asia" training table (allow-listed above) and its box [lon0, lon1, lat0, lat1]
  # (prep_log section 3: 25-180 E, -10-80 N); Europe test sites already in it are listed (F-H2)
  original_asia_table: legacy/data/processed/training_features_v2.parquet
  original_asia_box: [25.0, 180.0, -10.0, 80.0]
  offland_search_deg: 5.0              # item 2: countries within this many degrees are searched for the nearest
  diameter_bins_km: [5, 10, 20]        # item 3: sites whose records span more than each distance are counted

features:
  worldclim_vars: 19
  site_key_round: 5                    # site_key = round(lat,5)_round(lon,5), as in the handoff

clean_test:
  # The locked Asia -> Europe test. The stage refuses to run unless the plan file, the `locked` block below
  # and the two locked result files match these hashes AND the same hashes anchored in
  # mshi/analysis/clean_test.py (so neither an edited config nor another --config can change the test).
  plan: docs/handoff/ANALYSIS_PLAN_LOCKED.md
  plan_sha256: 9d50e120c42fa8b4ffdac7b98be1cfa461d4c22b7eac7f9a4aaf01e0befe3dac
  plan_locked_utc: "2026-11-01T07:28:35Z"
  locked_results:                      # scored once on 2026-11-01; final, never overwritten
    qc: {file: docs/handoff/results/clean_test_europe.json, sha256: b091795f9127d1de873ce42290b391d3d006775c9404ff36f0cb79671256d1e6}
    repo: {file: docs/handoff/results/clean_test_europe_repo_sensitivity.json, sha256: 48aa5bebf01c855d70a66623396b496fa875e8775402075486fa514c3539f9db}
  # SHA-256 of the canonical JSON of `locked` below (docs/DECISIONS.md D-P1-9 says what it covers).
  locked_sha256: ef029090d17d2a428cff48a710753cee75b63cf2f00748a73f1114798a4dae7f
  locked:
    train_continent: Asia
    test_continent: Europe
    target: log_rs
    sets:
      C8: [bio01, bio04, bio05, bio06, bio12, bio14, bio15, bio17]
      C8+NPP: [bio01, bio04, bio05, bio06, bio12, bio14, bio15, bio17, npp]
      C8+MODIS: [bio01, bio04, bio05, bio06, bio12, bio14, bio15, bio17, npp, lst_day, lst_night, lst_diurnal_range]
      C8+SOIL: [bio01, bio04, bio05, bio06, bio12, bio14, bio15, bio17, soc, nitrogen, phh2o, clay, sand, silt, bdod, cec]
      ALL: [bio01, bio04, bio05, bio06, bio12, bio14, bio15, bio17, soc, nitrogen, phh2o, clay, sand, silt, bdod, cec, npp, lst_day, lst_night, lst_diurnal_range]
    ml_learners: [XGB, RF]             # crossed with every set; OLS-TP is added as the 11th candidate
    ols_tp: [bio01, bio12]             # log Rs ~ bio01 + ln(bio12)
    ols_tp_log: [bio12]                # predictors entered as natural logs
    xgb: {n_estimators: 250, max_depth: 3, learning_rate: 0.05, subsample: 0.85, colsample_bytree: 0.85,
          min_child_weight: 4, reg_alpha: 0.5, reg_lambda: 2.0, n_jobs: 2, verbosity: 0}
    # fit with n_jobs 2 as in the handoff; predict with 1 thread (fixed tree-sum order; DEV-P1-15)
    rf: {n_estimators: 500, min_samples_leaf: 5, max_features: 0.5, n_jobs: 2, predict_n_jobs: 1}
    model_seed: 0
    cv_block_deg: 5.0
    cv_folds: 5
    cv_seeds: [42, 43, 44]
    tie_margin: 0.01
    bootstrap_n: 2000
    bootstrap_seed: 42
    block_bootstrap_deg: 2.0
    ci_quantiles: [0.025, 0.975]       # 95% percentile intervals (bootstraps and AOA difference)
    seed_spread: [0, 19]
    aoa_cv_seed: 42
    aoa_perm_repeats: 10
    aoa_perm_seed: 0
    aoa_whisker: {quantiles: [0.25, 0.75], iqr_multiplier: 1.5}   # threshold = Q3 + 1.5 IQR of training DI
    aoa_diff_seed: 7
    aoa_min_group: 10
    di_groups: 3                       # squared error by DI tercile
  variants: [qc, repo]                 # qc = primary; repo = plan-specified sensitivity (both required)
  # a re-run is "identical" to the locked result if the same model is selected and every primary metric
  # agrees to within this absolute tolerance; otherwise it is reported as a DEVIATION (ground rule 4)
  deviation_atol: 1.0e-9

reproduction_targets:                  # handoff values and tolerances (PROMPT section 4); checked by repro_checks and tests/
  srdb_repo_filter_records: {value: 4771, abs: 0}
  cosore_sites: {value: 66, abs: 0}
  records_after_coord_check: {value: 4781, rel: 0.01}
  records_after_qc: {value: 3694, rel: 0.01}
  qc_removed_by:
    f_method: {value: 450, rel: 0.02}
    f_quality: {value: 260, rel: 0.02}
    f_coverage: {value: 252, rel: 0.02}
    f_ecosys: {value: 243, rel: 0.02}
    f_dup: {value: 57, rel: 0.02}
  sites_qc_by_continent:
    Asia: {value: 387, rel: 0.02}
    North America: {value: 257, rel: 0.02}
    Europe: {value: 236, rel: 0.02}
    South America: {value: 42, rel: 0.02}
    Africa: {value: 26, rel: 0.02}
    Oceania: {value: 23, rel: 0.02}
  sites_qc_total: {value: 971, rel: 0.02}
  sites_repo_total: {value: 1225, rel: 0.02}
  locked_test:
    selected: OLS-TP
    asia_cv_r2: {value: 0.143, abs: 0.01}
    europe_n: {value: 235, abs: 0}     # no tolerance given; the closed test set must not change (rule 4)
    europe_r2: {value: 0.079, abs: 0.01}
    europe_ci_lo: {value: 0.013, abs: 0.01}
    europe_ci_hi: {value: 0.125, abs: 0.01}
  npp_corr_original_sites: {value: 0.982, abs: 0.01, n_sites: 889}
  # prep_log D8 also says the new extraction "recovers 189 sites lost to masked pixels"; no tolerance is
  # given in the brief, so this row is reported for information only
  npp_recovered_sites: {value: 189, info_only: true}

repro_checks:
  npp_min_sites: 3                     # NPP r is computed only with at least this many sites (else the row FAILs)

# Declared post-hoc sensitivity analysis of the locked test on geographic Europe (the author's decision Q-5 of
# 2026-11-03; D-C1-5, D-P2-4). The locked result stays primary; the result is labelled exploratory.
europe_geo_sensitivity:
  approved: "the author, 2026-11-03 (Q-5)"
  test_continent_geo: Europe
  # the author's check outside the pipeline (2026-11-03), reported to 4 (R2) and 3 (CI) decimals
  author_reference: {n: 231, r2: 0.0598, ci_site: [-0.001, 0.098]}
  reference_tolerance: {r2: 0.00005, ci: 0.0005}   # half a unit of the reported precision

# Phase 2 (brief section 5): exploratory, supporting analyses. They use the analysis tables (sites_analysis_*,
# features_analysis_*) and the geographic continent (continent_geo); every result is labelled exploratory.
# North America is used for exploratory analyses only (ground rule 5). docs/DECISIONS.md D-P2-5 onwards.
phase2:
  variant: qc                          # analysis site table: qc (primary); repo = sensitivity variant
  continents: [Asia, Europe, North America, South America, Africa, Oceania]
  min_test_sites: 30                   # continents with fewer test sites are reported in the supplementary table only
  target: log_rs
  c8: [bio01, bio04, bio05, bio06, bio12, bio14, bio15, bio17]
  bootstrap: {n: 2000, seed: 42, block_deg: 2.0, quantiles: [0.025, 0.975]}   # spatial-block bootstrap of metrics
  transfer:                            # item 1: continent matrix and leave-one-continent-out
    learners: [OLS-TP, GAM, RF, XGB]
    ols_tp: {features: [bio01, bio12], log: [bio12]}           # log Rs ~ MAT + ln MAP (the locked form)
    gam:                               # cubic B-spline smooths of MAT and ln MAP (statsmodels GLMGam; D-P2-8)
      features: [bio01, bio12]
      log: [bio12]
      df: 6
      degree: 3
      penalty_criterion: aic           # penalty weight chosen on the training data only
      penalty_optimizer: nm            # Nelder-Mead from alpha = 1 (deterministic; statsmodels' default restarts randomly)
      extrapolation: linear            # beyond the training range each smooth continues linearly (statsmodels refuses)
    rf:                                # features c8; tuned by nested spatial CV inside the training data only
      n_estimators: 500
      # reduced from 5 x 4 on measured run time alone (about 78 -> 25 min for within_continent), before any real
      # result; keeps the ends and middle of the former grid (D-P2-8)
      grid: {min_samples_leaf: [1, 5, 20], max_features: [0.33, 1.0]}
      inner_block_deg: 5.0
      inner_folds: 5
      inner_seed: 42
      seed: 0
      n_jobs: 4                        # fit threads; trees and predictions do not depend on it (checked for 1, 2, 4)
      predict_n_jobs: 1                # fixed tree-sum order at prediction time (bit-reproducible, DEV-P1-15)
    xgb_from: clean_test.locked.xgb    # "XGBoost with the original fixed parameters" (features c8, random_state seed)
    xgb_seed: 0
  within:                              # item 2: within-continent benchmark
    min_sites: 60
    block_deg: 5.0
    folds: 5
    seeds: [42, 43, 44]
    knndm:                             # kNNDM (port of CAST 1.2.0 knndm_geo; mshi/analysis/knndm.py, D-P2-7)
      k: 5
      maxp: 0.5                        # largest fold holds at most this share of the sites
      clustering: hierarchical
      linkage: ward.D2                 # CAST default
      nk_len: 100                      # cluster counts tried, log-spaced from k to n - 2 (CAST default)
      ks_alpha: 0.05                   # CAST's random-CV fallback when sites are not more clustered than the domain
      grid_deg: 0.5                    # prediction domain: the continent's land cells (mshi/analysis/grid.py)
      pred_weight: area                # cells drawn with probability proportional to their area (equal-area domain)
      max_pred_points: 4000
      seed: 42
  noise_ceiling:                       # item 3: 3-level REML (site / study within site / record) by continent
    min_records_per_site: 2
    n_boot: 200                        # site-cluster bootstrap of the variance shares
    seed: 7
    optimizer: lbfgs                   # statsmodels MixedLM.fit method (as N3); boundary models also fitted (D-P2-9)
    n_jobs: 4                          # bootstrap processes; no effect on any result (checked: byte-identical)
  aoa:                                 # item 4: area-of-applicability sensitivity (Meyer & Pebesma 2021)
    learner: XGB                       # on c8, as the handoff's E5
    train: [all, Asia]
    thresholds: [whisker_max, q95]     # outlier-removed maximum of training DI (as the handoff) vs its 0.95 quantile
    weights: [permutation, none]
    grid_deg: 0.5
    perm_repeats: 10
    perm_seed: 0
    cv: {block_deg: 5.0, folds: 5, seed: 42}
    threshold_rules:                   # outlier-removed maximum (as the locked test and E5) vs the 0.95 quantile
      whisker_max: {rule: whisker, quantiles: [0.25, 0.75], iqr_multiplier: 1.5}
      q95: {rule: quantile, q: 0.95}
    lat_bands:                         # E5's bands, extended to the poles; intervals (lower, upper]
      edges: [-90.0, -60.0, -23.5, 23.5, 50.0, 66.5, 90.0]
      labels: [Antarctic, S temperate, Tropics, N temperate, N boreal, Arctic]
    ice_sheets: {continent_geo: [Antarctica], south_of_lat: -60.0, subunits: [Greenland]}   # excluded domain (F-H25)
    transfer_check: {train: Asia, test: North America}   # inside vs outside the Asia model's AOA (exploratory)
  us_r2:                               # item 5: why the original US R2 was low (E4/E4b, clean)
    asia_box: [25.0, 180.0, -10.0, 80.0]     # the original (v1/v2) "Asia" box [lon0, lon1, lat0, lat1]
    us_box: [-125.0, -66.0, 24.0, 50.0]      # the original "US" box (it also holds Canadian and Mexican sites)
    learners: [XGB, OLS-TP]
